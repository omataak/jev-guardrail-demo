[project]
name = "jev-guardrail-demo"
version = "0.1.0"
description = "Jev guardrail playground for manufacturing"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "jinja2>=3.1,<4", "python-multipart>=0.0.18,<1", "python-dotenv>=1,<2"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
